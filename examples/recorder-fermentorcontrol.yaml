# FermenterControl recorder example
#
# Home Assistant records entities by default. This example only extends the
# full-resolution Recorder retention period globally from the default value to
# 90 days.
#
# IMPORTANT:
# If configuration.yaml already contains a recorder: block, merge
# purge_keep_days into that existing block. Do not create a second recorder:
# block.

recorder:
  purge_keep_days: 90
